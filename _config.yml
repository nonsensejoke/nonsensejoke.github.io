# 基本站点信息
title: Page
description: 一个使用 GitHub Pages + Jekyll 的博客

permalink: "/:year-:month-:day/:title/"

# GitHub Pages 默认使用 kramdown
markdown: kramdown

# 时间设置
timezone: Asia/Shanghai
# 日期在未来的文章也照常生成（避免 frontmatter 时间晚于提交时刻导致文章不出现）
future: true

# 配置 MathJax 渲染公式（如果需要）
kramdown:
  math_engine: mathjax

# 主题（如果你不自定义布局的话）
theme: jekyll-theme-minimal


